[project]
name = "bulutbelge-core"
version = "0.1.0"
description = "BulutBelge tespit, maskeleme ve belge işleme çekirdeği"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43",
  "pymupdf>=1.24",
  "regex>=2024.1",
  "pillow>=10",
  "lxml>=5",
  "opencv-python-headless>=4.8,<5",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bulutbelge_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

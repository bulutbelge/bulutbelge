# Çekme isteklerinde ve main'e her push'ta testler. Derleme iş akışındaki test işinin aynısıdır (paketleme yok).
# İş adı `Testler` main kural kümesinde zorunlu kontroldür (scripts/github_koruma.sh); adı değiştirirseniz orayı da değiştirin.
# Tetikleyici bilerek `pull_request`tır (pull_request_target değil): dış katkıcının kodu burada çalışır, bu yüzden
# izin yalnızca okuma, gizli bilgi kullanılmaz ve checkout kimlik bilgisi saklamaz. Dış katkıcının iş akışları onaysız
# çalışmaz (github_koruma.sh madde 5). OpenCV testlerde kilitteki tekerlekten gelir; FFmpeg'siz kaynaktan derleme
# (ve önbelleği) yalnızca paketleme içindir, burada gerekmez.
# Eylemler derleme.yml'deki commit SHA'larıyla sabitlenir; güncellerken ikisini birlikte güncelleyin.
name: Testler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testler-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  # derleme.yml ile aynı ortam.
  PYTHONUTF8: "1"

jobs:
  test:
    name: Testler
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0 fonts-dejavu-core
      - name: Test bağımlılıkları (hash'li kilit; bulgu 26)
        run: |
          python -m pip install --no-cache-dir --require-hashes -r desktop/engine/requirements.lock -r desktop/engine/requirements-test.lock
          python -m pip install --no-cache-dir --no-deps --no-build-isolation ./core ./desktop/engine
      - name: OCR dil dosyaları (SHA-256 doğrulamalı; düzleştirme testleri için)
        run: python desktop/engine/tessdata_indir.py
      - name: Çekirdek testleri
        run: python -m pytest -q
        working-directory: core
        env:
          BULUTBELGE_TESSDATA: ${{ github.workspace }}/desktop/engine/tessdata
      - name: Motor testleri
        run: python -m pytest -q
        working-directory: desktop/engine

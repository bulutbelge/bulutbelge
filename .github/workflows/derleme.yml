# Açık depo sürüm derlemesi. Bitbucket'taki bitbucket-pipelines.yml derleme adımları (1.87) örnek alındı.
# v* etiketinde ve elle çalışır: önce testler, sonra Windows (MSI, NSIS), macOS (dmg; Apple Silicon ve Intel), Linux (deb, AppImage),
# her platform için yerel MCP sunucusunun MCPB paketi (.mcpb, resmî MCP kaydı ve Smithery için; mcp-kayit.yml),
# en sonda SHA256SUMS ve taslak Release. İmzasız derlemedir; imza adımı için aşağıdaki SignPath yer tutucusuna bakın.
# Eylemler commit SHA'sı ile sabitlenir; sürüm yorumu yanındadır. Güncellerken SHA'yı etiketten yeniden çözün.
name: Derleme

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "macOS paketi de derlensin (GitHub macOS makinelerinde kuyruk uzun olabilir)"
        type: boolean
        default: false

# Varsayılan salt okunur; yazma izni yalnızca Release adımında verilir.
permissions:
  contents: read

concurrency:
  group: derleme-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  # Windows konsolu cp1252: Türkçe çıktı veren betikler çökmesin.
  PYTHONUTF8: "1"

jobs:
  test:
    name: Testler (çekirdek ve motor)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-0 fonts-dejavu-core
      - name: Test bağımlılıkları (hash'li kilit; bulgu 26)
        run: |
          python -m pip install --no-cache-dir --require-hashes -r desktop/engine/requirements.lock -r desktop/engine/requirements-test.lock
          python -m pip install --no-cache-dir --no-deps --no-build-isolation ./core ./desktop/engine
      - name: OCR dil dosyaları (SHA-256 doğrulamalı; düzleştirme testleri için)
        run: python desktop/engine/tessdata_indir.py
      - run: python -m pytest -q
        working-directory: core
        env:
          BULUTBELGE_TESSDATA: ${{ github.workspace }}/desktop/engine/tessdata
      - run: python -m pytest -q
        working-directory: desktop/engine

  # Matris önceden hazırlanır: `exclude` + `include` birlikte kullanılınca include satırı dışlanan
  # macOS'u yeni bir kombinasyon olarak geri ekliyordu (macOS her elle çalıştırmada derleniyordu).
  matris:
    name: Derleme planı
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          # Etikette her zaman; elle çalıştırmada yalnızca macos kutusu işaretliyse.
          MACOS: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
        run: |
          win='{"ad":"windows","calistirici":"windows-latest","hedef":"x86_64-pc-windows-msvc","ek_kilit":"requirements-windows.lock","paketler":"msi nsis","mcpb":"windows-x64"}'
          mac='{"ad":"macos","calistirici":"macos-latest","hedef":"aarch64-apple-darwin","ek_kilit":"requirements-macos.lock","paketler":"dmg","mcpb":"macos-arm64"}'
          # Intel Mac: bazı bağımlılıkların Intel tekerleği yok, motor ortamı macos_intel_derle.py ile kurulur.
          # MCPB paketi şimdilik yalnızca Apple Silicon için (resmî kayıtta tek macOS paketi var).
          mac_intel='{"ad":"macos-intel","calistirici":"macos-15-intel","hedef":"x86_64-apple-darwin","ek_kilit":"requirements-macos.lock","paketler":"dmg","mcpb":"","intel":true}'
          lin='{"ad":"linux","calistirici":"ubuntu-22.04","hedef":"x86_64-unknown-linux-gnu","ek_kilit":"","paketler":"deb appimage","mcpb":"linux-x64"}'
          if [ "$MACOS" = "true" ]; then liste="[$win,$mac,$mac_intel,$lin]"; else liste="[$win,$lin]"; fi
          echo "include=$liste" >> "$GITHUB_OUTPUT"

  derle:
    name: Derleme (${{ matrix.ad }})
    needs: [test, matris]
    runs-on: ${{ matrix.calistirici }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matris.outputs.include) }}
    defaults:
      run:
        shell: bash
    env:
      # macOS Developer ID imzası ve Apple notarizasyonu yalnızca bu gizli değer tanımlıysa çalışır (AKS-089);
      # tanımlı değilse paket ad-hoc imzayla çıkar (tauri.release.conf.json). Değerler açık depoda asla yer almaz.
      APPLE_IMZA: ${{ secrets.APPLE_CERTIFICATE != '' }}
      # Notarizasyon ayrıca App Store Connect API anahtarı ister; yoksa paket Developer ID ile imzalanır, notarize edilmez.
      APPLE_NOTER: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: SOURCE_DATE_EPOCH (commit zamanı)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Linux sistem paketleri
        if: matrix.ad == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libglib2.0-0 binutils fonts-dejavu-core
      # Intel Mac: pymupdf ve cryptography kaynaktan derlenir (özetleri doğrulanmış arşivlerden); sonra önbellekten gelir.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.intel
        with:
          path: ~/.cache/bb-intel
          key: intel-${{ matrix.hedef }}-${{ hashFiles('desktop/engine/requirements.lock', 'desktop/engine/macos_intel_derle.py') }}
      - name: Motor bağımlılıkları (hash'li kilit)
        env:
          INTEL: ${{ matrix.intel && 'true' || 'false' }}
        run: |
          # Ek kilit aynı pip çağrısında verilir: --require-hashes her bağımlılığın aynı anda sabit olmasını ister
          ek=""; if [ -n "${{ matrix.ek_kilit }}" ]; then ek="-r desktop/engine/${{ matrix.ek_kilit }}"; fi
          if [ "$INTEL" = "true" ]; then
            python desktop/engine/macos_intel_derle.py --onbellek ~/.cache/bb-intel --kilit-yaz "$RUNNER_TEMP/kalan.lock"
            python -m pip install --no-cache-dir --require-hashes -r "$RUNNER_TEMP/kalan.lock" $ek
            python desktop/engine/macos_intel_derle.py --onbellek ~/.cache/bb-intel --kur
          else
            python -m pip install --no-cache-dir --require-hashes -r desktop/engine/requirements.lock $ek
          fi
          python -m pip install --no-cache-dir --no-deps --no-build-isolation ./core ./desktop/engine
          if [ "$INTEL" = "true" ]; then
            # Intel'de çekirdek pymupdf "pymupdf-lite" adıyla kurulur (aynı modül); pip check bunu eksik sayar.
            out=$(python -m pip check || true); echo "$out"
            kalan=$(echo "$out" | grep -v -E "requires pymupdf, which is not installed|^No broken requirements" || true)
            [ -z "$kalan" ] || { echo "Beklenmeyen bağımlılık sorunu"; exit 1; }
            python -c "import pymupdf, cryptography"
          else
            python -m pip check
          fi
      # OpenCV FFmpeg'siz derlenir (GPL kodekleri pakete girmesin); ilk koşu uzun sürer, sonra önbellekten gelir.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/bb-opencv
          key: opencv-${{ matrix.hedef }}-${{ hashFiles('desktop/engine/requirements.lock', 'desktop/engine/opencv_derle.py') }}
      - name: OpenCV (FFmpeg'siz, kaynaktan, kilit özetiyle doğrulanır)
        run: python desktop/engine/opencv_derle.py --onbellek ~/.cache/bb-opencv
      - name: OCR dil dosyaları (SHA-256 doğrulamalı)
        run: python desktop/engine/tessdata_indir.py
      - name: Motoru paketle (PyInstaller)
        working-directory: desktop/engine
        env:
          BULUTBELGE_TARGET: ${{ matrix.hedef }}
        run: python build.py
      # Geçici anahtarlık: sertifika yalnızca bu koşunun anahtarlığına girer, iş bitince makine silinir. İmza ve
      # notarizasyon değişkenleri yalnızca macOS işine ve bu adımdan sonrasına aktarılır ($GITHUB_ENV).
      - name: macOS imza anahtarlığı ve notarizasyon anahtarı (Developer ID)
        if: startsWith(matrix.ad, 'macos') && env.APPLE_IMZA == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          kc="$RUNNER_TEMP/imza.keychain-db"; kp="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/sertifika.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/sertifika.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/sertifika.p12"
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application" || { echo "Developer ID sertifikası bulunamadı"; exit 1; }
          {
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "TAURI_IMZA_AYARI=--config $RUNNER_TEMP/tauri.imza.conf.json"
          } >> "$GITHUB_ENV"
          # Tauri, APPLE_API_* tanımlıysa notarize eder; tanımlı değilse yalnızca imzalar.
          if [ "$APPLE_NOTER" = "true" ]; then
            umask 077; printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::App Store Connect API anahtarı tanımlı değil: paket Developer ID ile imzalanır ama notarize edilmez."
          fi
          # Yapılandırmadaki ad-hoc kimliğin ("-") yerine Developer ID açıkça verilir (ortam değişkeni önceliğine güvenilmez).
          python3 -c 'import json,os,sys; json.dump({"bundle":{"macOS":{"signingIdentity":os.environ["APPLE_SIGNING_IDENTITY"]}}}, sys.stdout)' > "$RUNNER_TEMP/tauri.imza.conf.json"
      # Tauri yalnızca uygulamanın kendi ikilisini imzalar; kaynak olarak eklenen motorun her Mach-O dosyası
      # sertleştirilmiş çalışma zamanı ve zaman damgasıyla ayrıca imzalanmazsa Apple notarizasyonu reddeder.
      - name: Motoru imzala (macOS, Developer ID)
        if: startsWith(matrix.ad, 'macos') && env.APPLE_IMZA == 'true'
        run: bash desktop/scripts/macos-motor-imzala.sh "$APPLE_SIGNING_IDENTITY"
      - name: Arayüz bağımlılıkları
        working-directory: desktop
        run: npm ci
      - name: Uygulamayı derle (Tauri)
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json ${TAURI_IMZA_AYARI:-} -- --locked
      # İMZA (yer tutucu): SignPath onayı gelince açılır. Gizli değişken adları yalnızca burada
      # anılır; değerleri açık depoda asla yer almaz, GitHub › Settings › Secrets and variables altında tutulur.
      # - name: SignPath ile imzala (Windows)
      #   if: matrix.ad == 'windows'
      #   uses: signpath/github-action-submit-signing-request@<COMMIT-SHA>  # onay sonrası sabitlenecek
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      #     signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      # macOS: Apple Developer ID yok; tauri.release.conf.json ad-hoc imzayla ("-") paketin tamamını mühürler.
      # Mühür eksikse karantinalı indirmede macOS "hasar görmüş" der (0.1.0'da yaşandı); bu adım öyle bir paketi durdurur.
      - name: macOS paket mührünü doğrula
        if: startsWith(matrix.ad, 'macos')
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          codesign --verify --deep --strict --verbose=2 "$bundle"/macos/*.app
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$mnt"/*.app
          codesign -dv "$mnt"/*.app 2>&1 | grep -q "Sealed Resources"
          if [ "$APPLE_IMZA" = "true" ]; then
            # Developer ID ile imzalı, sertleştirilmiş çalışma zamanı açık ve zaman damgalı olmalı.
            codesign -dv --verbose=4 "$mnt"/*.app 2>&1 | grep -q "Authority=Developer ID Application"
            codesign -dv --verbose=4 "$mnt"/*.app 2>&1 | grep -q "flags=0x10000(runtime)"
            codesign -dv --verbose=4 "$mnt"/*.app/Contents/Resources/engine/bulutbelge-engine 2>&1 | grep -q "Authority=Developer ID Application"
          fi
          if [ "$APPLE_NOTER" = "true" ]; then
            # Apple onayı (notarizasyon) uygulamaya zımbalanmış olmalı; Gatekeeper uyarısız açar.
            xcrun stapler validate "$mnt"/*.app
            spctl --assess --type execute -vv "$mnt"/*.app 2>&1 | tee /dev/stderr | grep -q "Notarized Developer ID"
          fi
          hdiutil detach "$mnt"
      - name: Çıktıları topla
        run: |
          mkdir -p cikti
          bundle=desktop/src-tauri/target/release/bundle
          for p in ${{ matrix.paketler }}; do
            find "$bundle/$p" -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} cikti/ \;
          done
      # Yerel MCP sunucusunun MCPB paketi (karar: 2026-11-24-mcp-kaydi-mcpb). İçerik motor klasörünün birebir
      # kopyasıdır: macOS'ta yukarıda Developer ID ile imzalanan ve uygulamayla birlikte notarize edilen dosyalar.
      # Betik motoru `mcp` olarak çalıştırıp araç listesini alır, paketi açıp yeniden dener; etikette sürüm
      # etiketle aynı olmalıdır. Manifest, MCPB'nin resmî doğrulayıcısıyla (sabit sürüm) ayrıca denetlenir.
      - name: MCPB paketi (yerel MCP sunucusu)
        if: matrix.mcpb != ''
        run: |
          surum=""; if [ "$GITHUB_REF_TYPE" = "tag" ]; then surum="--surum ${GITHUB_REF_NAME#v}"; fi
          mkdir -p "$RUNNER_TEMP/mcpb"
          python desktop/scripts/mcpb_paketle.py --motor desktop/src-tauri/binaries/engine \
            --platform ${{ matrix.mcpb }} --cikti cikti $surum --manifest-yaz "$RUNNER_TEMP/mcpb/manifest.json"
          cp desktop/src-tauri/icons/icon.png "$RUNNER_TEMP/mcpb/icon.png"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate "$RUNNER_TEMP/mcpb/manifest.json"
      # Çevrimdışı Windows paketi: WebView2 kurulum paketin içindedir (internetsiz kurumlar için).
      # Normal paketler yukarıda cikti/ içine kopyalandı; burada aynı paketler yeniden derlenir ve "-cevrimdisi" ekiyle adlandırılır.
      - name: Uygulamayı derle, çevrimdışı (Tauri, Windows)
        if: matrix.ad == 'windows'
        working-directory: desktop
        run: npx tauri build --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.offline.conf.json -- --locked
      - name: Çevrimdışı çıktıları topla (Windows)
        if: matrix.ad == 'windows'
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          for p in ${{ matrix.paketler }}; do
            for f in $(find "$bundle/$p" -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' \)); do
              ad=$(basename "$f"); cp "$f" "cikti/${ad%.*}-cevrimdisi.${ad##*.}"
            done
          done
      - name: Çıktıları özetle
        run: |
          ls -l cikti
          test -n "$(ls -A cikti)"
          (cd cikti && (sha256sum * 2>/dev/null || shasum -a 256 *) | tee ../ozet-${{ matrix.ad }}.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kurulum-${{ matrix.ad }}
          path: cikti/*
          if-no-files-found: error
          retention-days: 3

  yayin:
    name: SHA256SUMS ve taslak Release
    needs: derle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Derleme kanıtı (Sigstore): kısa ömürlü OIDC kimliği ve kanıtın depoya yazılması için.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: cikti
          pattern: kurulum-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: cikti
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort | xargs sha256sum | tee SHA256SUMS
      # Derleme kanıtı (SLSA provenance, Sigstore ile imzalı, herkese açık şeffaflık kaydında): her kurulum dosyasının
      # bu depodan, bu etiketten ve bu iş akışıyla üretildiğini kanıtlar. Windows'ta kod imzası olmadığı için kullanıcıya
      # sunulan bağımsız doğrulama budur: gh attestation verify <dosya> -R bulutbelge/bulutbelge
      - name: Derleme kanıtı (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cikti/BulutBelge_*
            cikti/bulutbelge-mcp-*.mcpb
      # Taslak Release: yayımlamak insan onayıyla, GitHub arayüzünden yapılır.
      - name: Taslak Release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ github.ref_name }}
        run: |
          gh release create "$ETIKET" cikti/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "BulutBelge $ETIKET" --notes "Taslak. İmzasız derleme; SHA256SUMS ile doğrulayın. bulutbelge-mcp-*.mcpb: yerel MCP sunucusu (masaüstü uygulaması kurulu olmalı); Release yayımlanınca MCP kaydına mcp-kayit.yml yazar."

# Windows denemesinin otomatik kısmı: bir Derleme koşusunun Windows paketini temiz bir GitHub Windows makinesinde
# kurar ve dener (desktop/scripts/windows_deneme.ps1). Elle çalışır; sürümden önce ve Windows'a dokunan
# değişikliklerden sonra kullanılır. Gözle bakılacaklar (sihirbaz görünümü, kurulum metinleri, gerçek kullanıcı
# oturumundaki SmartScreen penceresi) bir Windows makinesinde ayrıca denenir.
# Eylemler commit SHA'sı ile sabitlenir; sürüm yorumu yanındadır.
name: Windows denemesi

on:
  workflow_dispatch:
    inputs:
      kosu:
        description: "Paketi alınacak Derleme koşusunun numarası (kurulum-windows)"
        required: true
        type: string
      karsilastirma:
        description: "WebView2 DNS ölçümünde karşılaştırılacak eski sürüm etiketi"
        type: string
        default: "v0.1.1"

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"

jobs:
  deneme:
    name: Windows denemesi (otomatik)
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Sahte belge araçları (hash'li kilit; bulgu 26)
        run: python -m pip install --no-cache-dir --require-hashes -r desktop/engine/requirements.lock
      - name: Paket (Derleme koşusu)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kurulum-windows
          path: ${{ runner.temp }}/paket
          run-id: ${{ inputs.kosu }}
          github-token: ${{ github.token }}
      - name: Karşılaştırma için eski sürümün NSIS kurulumu
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ETIKET: ${{ inputs.karsilastirma }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\eski" | Out-Null
          gh release download $env:ETIKET -R $env:GITHUB_REPOSITORY -p '*_x64-setup.exe' -D "$env:RUNNER_TEMP\eski"
          Get-ChildItem "$env:RUNNER_TEMP\eski"
      - name: Sahte belgeler
        run: python desktop/scripts/windows_deneme_belgeler.py uret "${{ runner.temp }}/belgeler"
      - name: Deneme
        shell: pwsh
        run: |
          $eski = Get-ChildItem "$env:RUNNER_TEMP\eski" -Filter '*_x64-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
          ./desktop/scripts/windows_deneme.ps1 -Paket "$env:RUNNER_TEMP\paket" -Eski $eski `
            -Belgeler "$env:RUNNER_TEMP\belgeler" -Depo $env:GITHUB_WORKSPACE -Rapor "$env:RUNNER_TEMP\rapor.md"
      - name: Rapor
        if: always()
        shell: pwsh
        run: if (Test-Path "$env:RUNNER_TEMP\rapor.md") { Get-Content "$env:RUNNER_TEMP\rapor.md" -Raw | Add-Content $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-deneme-raporu
          path: ${{ runner.temp }}/rapor.md
          if-no-files-found: ignore

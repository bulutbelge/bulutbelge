# Katkıcı Lisans Sözleşmesi denetimi (TAKIP G.3). Dış çekme isteklerinde CLA imzası yoksa kontrol kırmızı kalır;
# imza yorumla verilir ve ayrı bir dalda (cla-imzalar) saklanır. İmza dalı korumasız olmalıdır (main korumalıdır).
# Eylem commit SHA'sı ile sabitlenir (v2.6.1). Çekme isteğinin kodu bu iş akışında çalıştırılmaz (pull_request_target).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA imzası
    runs-on: ubuntu-22.04
    steps:
      - name: CLA denetimi
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          path-to-signatures: "imzalar/cla.json"
          branch: "cla-imzalar"
          allowlist: "dependabot[bot],github-actions[bot]"
          custom-notsigned-prcomment: "Katkınız için teşekkürler. Birleştirebilmemiz için önce Katkıcı Lisans Sözleşmesini (CLA.md) okuyup bu çekme isteğine aşağıdaki yorumu yazmanız gerekir. Thank you for your contribution; please read CLA.md and post the comment below to sign."
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "Tüm katkıcılar CLA'yı imzaladı. All contributors have signed the CLA."

[package]
name = "bulutbelge-desktop"
version = "0.1.3"
license = "AGPL-3.0-only"
description = "BulutBelge masaüstü uygulaması"
authors = ["Proteksistem"]
edition = "2024"

[lib]
# Windows'ta bin ile lib adı çakışmasın diye `_lib` soneki gerekli (rust-lang/cargo#8519).
name = "bulutbelge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

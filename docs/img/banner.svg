<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">BulutBelge</title>
  <desc id="d">BulutBelge: belgeyi paylaşmadan önce kişisel verileri dosyanın içinden gerçekten silin.</desc>
  <defs>
    <linearGradient id="arka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b3d"/>
      <stop offset="0.55" stop-color="#1b2f6b"/>
      <stop offset="1" stop-color="#4a2f9b"/>
    </linearGradient>
    <linearGradient id="simge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f86ff"/>
      <stop offset="1" stop-color="#8a63ee"/>
    </linearGradient>
    <radialGradient id="isik" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7aa7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa7ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#arka)"/>
  <rect width="1280" height="340" rx="22" fill="url(#isik)"/>

  <!-- sağda: belge kartı ve maskelenen satırlar -->
  <g transform="translate(820 38)">
    <rect width="380" height="264" rx="16" fill="#ffffff" opacity="0.97"/>
    <rect x="28" y="28" width="150" height="12" rx="6" fill="#1c1f26" opacity="0.88"/>
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2a2f3a">
      <text x="28" y="82">Ad Soyad:</text>
      <rect x="128" y="66" width="150" height="22" rx="4" fill="#1c1f26"/>
      <text x="28" y="122">TC Kimlik:</text>
      <rect x="128" y="106" width="130" height="22" rx="4" fill="#1c1f26"/>
      <text x="28" y="162">IBAN:</text>
      <text x="128" y="162" font-family="Consolas, 'Courier New', monospace" fill="#1f5fd1">**** 1326</text>
      <text x="28" y="202">E-posta:</text>
      <text x="128" y="202" font-family="Consolas, 'Courier New', monospace" fill="#6941c6">[E-POSTA]</text>
    </g>
    <rect x="28" y="226" width="200" height="8" rx="4" fill="#e2e6ef"/>
    <g transform="translate(300 214)">
      <circle cx="22" cy="22" r="22" fill="#1f9d63"/>
      <path d="M12 23l7 7 14-15" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- solda: logo ve slogan -->
  <g transform="translate(64 70)">
    <rect width="76" height="76" rx="18" fill="url(#simge)"/>
    <path d="M24.4 59.9a11.9 11.9 0 0 1-1.7-23.6A17.8 17.8 0 0 1 56.8 39.2a10 10 0 0 1-1.5 20.7H24.4Z" fill="#fff"/>
    <rect x="28" y="46.5" width="23.8" height="7" rx="2.8" fill="#16213d"/>
  </g>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="166" y="130" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-1">Bulut<tspan fill="#8fb4ff">Belge</tspan></text>
    <text x="64" y="204" font-size="27" font-weight="600" fill="#ffffff">Belgeyi paylaşmadan önce kişisel verileri</text>
    <text x="64" y="240" font-size="27" font-weight="600" fill="#ffffff">dosyanın içinden <tspan fill="#8fb4ff">gerçekten</tspan> silin.</text>
    <text x="64" y="288" font-size="18" fill="#b9c6ea">Gerçek silme · Kaçak denetimi · Çevrimdışı masaüstü · API</text>
  </g>
</svg>
